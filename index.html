<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Cyber Quiz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <style>
        :root {
            --primary-bg: #0d1b2a;
            --secondary-bg: #1b263b;
            --text-color: #e0e1dd;
            --accent-color: #00d4ff;
            --code-bg: #2d2d2d;
            --shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        body {
            background: linear-gradient(135deg, var(--primary-bg), var(--secondary-bg));
            font-family: 'Orbitron', sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        .quiz-container {
            max-width: 800px;
            margin: 80px auto;
            padding: 30px;
            background: rgba(27, 38, 59, 0.9);
            border-radius: 15px;
            box-shadow: var(--shadow);
            position: relative;
            animation: fadeIn 1s ease-in-out;
            text-align: center;
            display: none; /* Hidden until user submits the popup */
        }

        .question-text {
            text-align: left;
            margin-bottom: 20px;
        }

        .code-box {
            background: var(--code-bg);
            color: #fff;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
            text-align: left;
        }

        .code-box:hover {
            transform: scale(1.02);
        }

        .chicks {
            font-size: 32px;
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .chick {
            transition: all 0.5s ease;
        }

        .chick.lost {
            animation: walkAway 1s ease forwards;
        }

        .hint-btn {
            font-size: 24px;
            color: var(--accent-color);
            cursor: pointer;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .hint-btn:hover {
            color: #ff9500;
            transform: rotate(360deg);
        }

        .hidden { display: none; }

        .success {
            color: #00ff85;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff85;
            animation: neonGlow 1s infinite alternate;
        }

        .wrong {
            color: #ff1e1e;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff1e1e;
            animation: glitch 0.5s ease-in-out;
        }

        button {
            background: linear-gradient(45deg, var(--accent-color), #007bff);
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            color: #fff;
            font-weight: bold;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.5);
        }

        button:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 0 25px rgba(0, 123, 255, 0.8);
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 24px;
            color: var(--accent-color);
            cursor: pointer;
            transition: transform 0.5s ease;
        }

        .theme-toggle:hover {
            transform: rotate(180deg);
        }

        #hint {
            color: #fff;
        }

        /* Popup Styles */
        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup-content {
            background: var(--secondary-bg);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: var(--shadow);
            color: var(--text-color);
            width: 90%;
            max-width: 400px;
        }

        .popup-content input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid var(--accent-color);
            border-radius: 5px;
            background: var(--code-bg);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
        }

        .popup-content button {
            margin-top: 20px;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes neonGlow {
            0% { text-shadow: 0 0 5px #00ff85, 0 0 10px #00ff85; }
            100% { text-shadow: 0 0 20px #00ff85, 0 0 30px #00ff85; }
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 5px); }
            40% { transform: translate(5px, -5px); }
            60% { transform: translate(-5px, 0); }
            80% { transform: translate(5px, 0); }
            100% { transform: translate(0); }
        }

        @keyframes walkAway {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(100px); opacity: 0; }
        }

        body.light-mode {
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            color: #333;
        }

        body.light-mode .quiz-container {
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        body.light-mode .code-box {
            background: #f4f4f4;
            color: #222;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
        }

        body.light-mode #hint {
            color: #333;
        }

        body.light-mode .popup-content {
            background: #fff;
            color: #333;
        }

        body.light-mode .popup-content input {
            background: #f4f4f4;
            color: #333;
            border: 1px solid #007bff;
        }
    </style>
</head>
<body>
    <div class="theme-toggle" onclick="toggleTheme()">
        <i class="fas fa-moon"></i>
    </div>

    <!-- Popup for name and mobile -->
    <div id="popup" class="popup">
        <div class="popup-content">
            <h2>Welcome to the C++ Cyber Quiz</h2>
            <p>Please enter your details to start:</p>
            <input type="text" id="fullName" placeholder="Enter your full name (quadruple)" required>
            <input type="tel" id="mobile" placeholder="Enter your mobile number" required>
            <button onclick="startQuiz()">Start Quiz</button>
        </div>
    </div>

    <div class="quiz-container" id="quizContainer">
        <div id="chicks" class="chicks">
            <span class="chick">🐥</span>
            <span class="chick">🐥</span>
            <span class="chick">🐥</span>
        </div>
        <h2 id="question" class="question-text"></h2>
        <i class="fas fa-lightbulb hint-btn" onclick="showHint()"></i>
        <p id="hint" class="hidden mt-2"></p>
        <div class="code-box" id="code-snippet"></div>
        <div id="options" class="d-grid gap-2 mt-3"></div>
        <p id="feedback" class="mt-3"></p>
    </div>

    <script>
        const questions = [  
            {
                question: "What is the output of the following code?",
                code: `#include <iostream>\nusing namespace std;\nint main() {\n    int arr[] = {1, 2, 3, 4, 5};\n    cout << arr[3];\n    return 0;\n}`,
                options: ["1", "2", "3", "4", "5"],
                correct: 3,
                hint: "Pay attention to the index being accessed in the array."
            },
            {
                question: "What is the error in the following code?",
                code: `#include <iostream>\nusing namespace std;\nvoid func() {\n    cout << "Hello";\n}\nint main() {\n    func;\n    return 0;\n}`,
                options: [
                    "func should be func().",
                    "cout is not defined.",
                    "void func() should be int func().",
                    "return 0; is incorrect.",
                    "cin is not defined."
                ],
                correct: 0,
                hint: "Pay attention to how the function is called."
            },
            {
                question: "What is the error in the following code?",
                code: `#include <iostream>\nusing namespace std;\n\nvoid showMessage() {\n    cout << "Hello";\n}\n\nint main() {\n    showMessage();\n    return "Done";\n}`,
                options: [
                    "cout is not defined.",
                    "void showMessage() should be int showMessage().",
                    "showMessage() should be showMessage;.",
                    "return should be return 0;.",
                    "cin is not defined."
                ],
                correct: 3,
                hint: "Pay attention to the return type of the main function."
            },
        
            {
                question: "What is the output of the following code?",
                code: `#include <iostream>\nusing namespace std;\nint main() {\n    int a = 10, b = 3;\n    cout << a % b;\n    return 0;\n}`,
                options: ["0", "1", "2", "3", "4"],
                correct: 1,
                hint: "Pay attention to the modulus operation."
            },
            {
                question: "Complete the code to create a function that prints 'Welcome'?",
                code: `#include <iostream>\nusing namespace std;\n    welcome()\n    {\n    cout << "Welcome";\n    }`,
                options: ["int", "string", "void", "char"],
                correct: 2,
                hint: "Pay attention to the function type that does not return a value."
            },
          
            {
                question: "What is the output of the following code?",
                code: `#include <iostream>\nusing namespace std;\n\nvoid AKOUSH(int &x) {\n    x = 10;\n}\n\nint main() {\n    int a = 5;\n    AKOUSH(a);\n    cout << a;\n    return 0;\n}`,
                options: ["5", "10", "15", "20", "25"],
                correct: 1,
                hint: "Pay attention to how the variable is passed by reference."
            },

            {
                question: "What is the output of the following code?",
                code: `#include <iostream>\nusing namespace std;\nint main() {\n    int arr[4] = {1, 2, 3, 4};\n    for (int i = 0; i < 4; i++) {\n    arr[i] = arr[(i + 1) % 4];\n    }\n    for (int i = 0; i < 4; i++) {\n    cout << arr[i] << " ";\n    }\n    return 0;\n}`,
                options: [
                    "1 2 3 4",
                    "4 1 2 3",
                    "3 4 1 2",
                    "2 3 4 0",
                    "1 3 2 4"
                ],
                correct: 3,
                hint: "Pay attention to how the array elements are modified within the loop."
            }
            // {
            //     question: "What is the output of the following code?",
            //     code: `#include <iostream>\nusing namespace std;\nint main() {\n    for (int i = 0, j = 10; i < j; i++, j--) {\n    cout << i << " " << j << " ";\n    }\n    return 0;\n}`,
            //     options: [
            //         "0 10 1 9 2 8 3 7 4 6 5 5",
            //         "0 10 1 9 2 8 3 7 4 6 5 5 6 4",
            //         "0 10 1 9 2 8 3 7 4 6",
            //         "0 10 1 9 2 8 3 7 4 6 5 5 6 4 7 3",
            //         "0 10 1 9 2 8 3 7 4 6 5 5 6 4 7 3 8 2"
            //     ],
            //     correct: 2,
            //     hint: "Pay attention to how the loop works and updates the variables."
            // },
           
        ];
    
        let currentQuestion = 0;
        let lives = 3;
        let hintClickCount = 0;
        let userName = "";
        let userMobile = "";
        let correctAnswers = 0; // Track correct answers
    
        const questionElem = document.getElementById("question");
        const codeSnippetElem = document.getElementById("code-snippet");
        const optionsElem = document.getElementById("options");
        const feedbackElem = document.getElementById("feedback");
        const hintElem = document.getElementById("hint");
        const chicksElem = document.getElementById("chicks");
        const quizContainer = document.getElementById("quizContainer");
        const popup = document.getElementById("popup");
    
        function startQuiz() {
            const fullName = document.getElementById("fullName").value.trim();
            const mobile = document.getElementById("mobile").value.trim();
    
            // Validate input
            const nameParts = fullName.split(" ");
            if (nameParts.length !== 4) {
                alert("Please enter your full quadruple name (e.g., First Second Third Fourth)!");
                return;
            }
            if (!/^\d{10,15}$/.test(mobile)) {
                alert("Please enter a valid mobile number (10-15 digits)!");
                return;
            }
    
            userName = fullName;
            userMobile = mobile;
            popup.style.display = "none";
            quizContainer.style.display = "block";
            loadQuestion();
        }
    
        function checkDeviceAccess() {
            const deviceId = localStorage.getItem("examDeviceId");
            if (!deviceId) {
                const uniqueId = Math.random().toString(36).substring(2) + Date.now().toString(36);
                localStorage.setItem("examDeviceId", uniqueId);
                return true;
            }
            if (localStorage.getItem("examCompleted") === "true") {
                questionElem.innerText = "Access Denied: One attempt per device!";
                codeSnippetElem.innerHTML = "";
                optionsElem.innerHTML = "";
                hintElem.classList.add("hidden");
                chicksElem.innerHTML = "";
                return false;
            }
            return true;
        }
    
        function updateChicks() {
            const chicks = chicksElem.querySelectorAll(".chick");
            chicks.forEach((chick, index) => {
                if (index >= lives) {
                    chick.classList.add("lost");
                } else {
                    chick.classList.remove("lost");
                }
            });
        }
    
        function loadQuestion() {
            if (!checkDeviceAccess()) return;
    
            if (lives <= 0) {
                endExamDueToLives();
                return;
            }
    
            if (currentQuestion >= questions.length) {
                if (correctAnswers === questions.length) {
                    questionElem.innerText = `تهانينا ${userName}! لقد أتقنت الاختبار بنجاح!`;
                    sendWhatsAppMessage(); // Automatically send message for winners
                } else {
                    questionElem.innerText = "Mission Complete: Quiz Mastered!";
                }
                codeSnippetElem.innerHTML = "";
                optionsElem.innerHTML = "";
                hintElem.classList.add("hidden");
                chicksElem.innerHTML = "";
                localStorage.setItem("examCompleted", "true");
                return;
            }
    
            const q = questions[currentQuestion];
            questionElem.innerText = q.question;
            codeSnippetElem.innerHTML = `<pre>${q.code}</pre>`;
            hintElem.innerText = q.hint;
            hintElem.classList.add("hidden");
            optionsElem.innerHTML = "";
            q.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.className = "btn p-2 shadow-lg";
                btn.innerText = option;
                btn.onclick = () => checkAnswer(index, q.correct);
                optionsElem.appendChild(btn);
            });
            updateChicks();
        }
    
        function checkAnswer(selected, correct) {
            if (selected === correct) {
                feedbackElem.innerHTML = "✅ <span class='success'>Code Cracked!</span>";
                correctAnswers++; // Increment correct answers
                setTimeout(() => {
                    feedbackElem.innerHTML = "";
                    currentQuestion++;
                    loadQuestion();
                }, 1000);
            } else {
                lives--;
                feedbackElem.innerHTML = "❌ <span class='wrong'>System Failure!</span>";
                setTimeout(() => {
                    feedbackElem.innerHTML = "";
                    loadQuestion();
                }, 1000);
            }
        }
    
        function endExamDueToLives() {
            questionElem.innerText = `حظ أوفر المرة القادمة ${userName}!`;
            codeSnippetElem.innerHTML = "";
            optionsElem.innerHTML = "";
            hintElem.classList.add("hidden");
            chicksElem.innerHTML = "";
            localStorage.setItem("examCompleted", "true");
            // No WhatsApp message sent for losers
        }
    
        function resetExam() {
            lives = 3;
            currentQuestion = 0;
            correctAnswers = 0; // Reset correct answers
            localStorage.removeItem("examCompleted");
            hintClickCount = 0;
            chicksElem.innerHTML = `
                <span class="chick">🐥</span>
                <span class="chick">🐥</span>
                <span class="chick">🐥</span>
            `;
            loadQuestion();
        }
    
        function showHint() {
            hintElem.classList.toggle("hidden");
            hintClickCount++;
            if (hintClickCount >= 5) {
                resetExam();
            }
        }
    
        async function sendWhatsAppMessage() {
            const recipientNumber = "+201011728299"; // Egyptian number with country code
            const message = `الفائز: ${userName}\nرقم الهاتف: ${userMobile}`;
            
            // Simulate automatic sending using a fetch request to a placeholder webhook
            // Replace this with a real WhatsApp API endpoint if available
            try {
                const response = await fetch('https://webhook.site/your-unique-webhook-id', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        to: recipientNumber,
                        message: message
                    })
                });
                if (response.ok) {
                    console.log("Message sent successfully!");
                } else {
                    console.error("Failed to send message.");
                }
            } catch (error) {
                console.error("Error sending message:", error);
            }
    
            // Fallback: Open WhatsApp link if automatic sending isn't feasible
            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${recipientNumber}?text=${encodedMessage}`;
            window.open(whatsappUrl, "_blank"); // Opens WhatsApp as a fallback
        }
    
        function toggleTheme() {
            document.body.classList.toggle("light-mode");
            const icon = document.querySelector(".theme-toggle i");
            icon.classList.toggle("fa-moon");
            icon.classList.toggle("fa-sun");
        }
    </script>
