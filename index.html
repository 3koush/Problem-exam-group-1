<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Programming Questions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <style>
        body { 
            background-color: #f8f9fa; 
            font-family: Arial, sans-serif; 
            text-align: left; 
        }
        .quiz-container { 
            max-width: 700px; 
            margin: 50px auto; 
            text-align: center; 
            padding: 20px; 
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1); 
            border-radius: 10px; 
            background: white; 
        }
        .code-box { 
            background: #222; 
            color: #fff; 
            padding: 15px; 
            border-radius: 8px; 
            text-align: left; 
            font-family: monospace; 
            direction: ltr; 
        }
        .hidden { display: none; }
        .success { 
            color: green; 
            font-size: 20px; 
            font-weight: bold; 
            animation: bounce 0.5s ease-in-out; 
        }
        .wrong { 
            color: red; 
            font-size: 20px; 
            font-weight: bold; 
            animation: shake 0.5s ease-in-out; 
        }
        .hint-btn { 
            cursor: pointer; 
            font-size: 20px; 
            margin-left: 10px; 
            color: #f39c12; 
        }
        .hint-btn:hover { color: #e67e22; }
        button { 
            transition: all 0.3s ease-in-out; 
            border-radius: 8px; 
            margin: 5px 0; 
        }
        button:hover { transform: scale(1.05); box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2); }
        .hearts { 
            font-size: 24px; 
            color: red; 
            margin-bottom: 10px; 
        }
        #resetBtn { 
            margin-top: 10px; 
        }
        @keyframes bounce { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-10px); } 
        }
        @keyframes shake { 
            0%, 100% { transform: translateX(0); } 
            25% { transform: translateX(-5px); } 
            50% { transform: translateX(5px); } 
            75% { transform: translateX(-5px); } 
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div id="hearts" class="hearts">❤️❤️❤️</div> <!-- عرض القلوب -->
        <h2 id="question" class="mb-4"></h2>
        <i class="fas fa-lightbulb hint-btn" onclick="showHint()"></i>
        <p id="hint" class="hidden mt-2 text-muted"></p>
        <div class="code-box" id="code-snippet"></div>
        <div id="options" class="d-grid gap-2 mt-3"></div>
        <p id="feedback" class="mt-3"></p>
        <button id="resetBtn" class="btn btn-success hidden" onclick="resetExam()">إعادة الامتحان</button>
    </div>

    <script>
        const questions = [  
        {
                question: "What is the output of the following code?",
                code: `#include <iostream>\nusing namespace std;\nint main() {\n    int arr[] = {1, 2, 3, 4, 5};\n    cout << arr[3];\n    return 0;\n}`,
                options: [
                    "1",
                    "2",
                    "3",
                    "4",
                    "5"
                ],
                correct: 3,
                hint: "Pay attention to the index being accessed in the array."
            },
            {
                question: "What is the error in the following code?",
                code: `#include <iostream>\nusing namespace std;\nint main() {\n    int a = 5;\n    cout << "The value of a is: " << a << endl\n    return 0;\n}`,
                options: [
                    "int a = 5; should be float a = 5;.",
                    "cout is not defined.",
                    "Missing ; after cout.",
                    "return 0; is incorrect.",
                    "cin is not defined."
                ],
                correct: 2,
                hint: "Pay attention to the punctuation at the end of the line."
            },
            {
                question: "What is the error in the following code?",
                code: `#include <iostream>\nusing namespace std;\nvoid func() {\n    cout << "Hello";\n}\nint main() {\n    func;\n    return 0;\n}`,
                options: [
                    "func should be func().",
                    "cout is not defined.",
                    "void func() should be int func().",
                    "return 0; is incorrect.",
                    "cin is not defined."
                ],
                correct: 0,
                hint: "Pay attention to how the function is called."
            },
            {
                question: "What is the output of the following code?",
                code: `#include <iostream>\nusing namespace std;\nint main() {\n    int x = 3, y = 2;\n    cout << x / y * 2;\n    return 0;\n}`,
                options: [
                    "1",
                    "2",
                    "3",
                    "4",
                    "5"
                ],
                correct: 1,
                hint: "Pay attention to the order of arithmetic operations."
            },
            {
                question: "What is the error in the following code?",
                code: `#include <iostream>\nusing namespace std;\nint main() {\n    int arr[3] = {1, 2, 3, 4};\n    cout << arr[2];\n    return 0;\n}`,
                options: [
                    "cout is not defined.",
                    "int arr[3] should be float arr[3].",
                    "return 0; is incorrect.",
                    "cin is not defined.",
                    "The array has more elements than declared."
                ],
                correct: 4,
                hint: "Pay attention to the declared size of the array."
            },
            {
                question: "What is the error in the following code?",
                code: `#include <iostream>\nusing namespace std;\nint main() {\n    int x;\n    cin >> x;\n    cout << "You entered: " x;\n    return 0;\n}`,
                options: [
                    "Missing << after cout.",
                    "cin is not defined.",
                    "int x should be float x.",
                    "return 0; is incorrect."
                ],
                correct: 0,
                hint: "Pay attention to how cout is used."
            },
            {
                question: "What is the error in the following code?",
                code: `#include <iostream>\nusing namespace std;\n\nvoid showMessage() {\n    cout << "Hello";\n}\n\nint main() {\n    showMessage();\n    return "Done";\n}`,
                options: [
                    "cout is not defined.",
                    "void showMessage() should be int showMessage().",
                    "showMessage() should be showMessage;.",
                    "return should be return 0;.",
                    "cin is not defined."
                ],
                correct: 3,
                hint: "Pay attention to the return type of the main function."
            },
            {
                question: "What is the output of the following code?",
                code: `#include <iostream>\nusing namespace std;\nint main() {\n    int a = 10, b = 3;\n    cout << a % b;\n    return 0;\n}`,
                options: [
                    "0",
                    "1",
                    "2",
                    "3",
                    "4"
                ],
                correct: 1,
                hint: "Pay attention to the modulus operation."
            },
            {
                question: "What is the output of the following code?",
                code: `#include <iostream>\nusing namespace std;\nint main() {\n    int x = 5;\n    cout<<x<<" ";\n    x++;\n    cout << ++x<<" "<<x++<<" "<<x;\n    return 0;\n}`,
                options: [
                    "5 7 7 7",
                    "5 6 6 7",
                    "5 6 7 8",
                    "5 7 7 8",
                    "5 7 8 8"
                ],
                correct: 3,
                hint: "Pay attention to the order of increment operations."
            },
            {
                question: "What is the output of the following code?",
                code: `#include <iostream>\nusing namespace std;\nint main() {\n    int x = 10;\n    cout << (x == 10);\n    return 0;\n}`,
                options: [
                    "0",
                    "1",
                    "10"
                ],
                correct: 1,
                hint: "Pay attention to the result of the logical comparison."
            },
            {
                question: "What is the output of the following code?",
                code: `#include <iostream>\nusing namespace std;\nint main() {\n    int arr[] = {1, 2, 3, 4, 5};\n    cout << arr[3];\n    return 0;\n}`,
                options: [
                    "1",
                    "2",
                    "3",
                    "4",
                    "5"
                ],
                correct: 3,
                hint: "Pay attention to the index being accessed in the array."
            },
            {
                question: "Complete the following code with the appropriate type?",
                code: `#include <iostream>\nusing namespace std;\nint main() {\n    ______ name = "John";\n    cout << name;\n    return 0;\n}`,
                options: [
                    "char",
                    "string",
                    "int",
                    "text"
                ],
                correct: 1,
                hint: "Pay attention to the appropriate data type for storing text."
            },
            {
                question: "Complete the code to create a function that prints 'Welcome'?",
                code: `#include <iostream>\nusing namespace std;\n    welcome()\n    {\n    cout << "Welcome";\n    }`,
                options: [
                    "int",
                    "string",
                    "void",
                    "char"
                ],
                correct: 2,
                hint: "Pay attention to the function type that does not return a value."
            },
            {
                question: "What is the output of the following code?",
                code: `#include <iostream>\nusing namespace std;\n\nvoid mostafa(int &x) {\n    x = 10;\n}\n\nint main() {\n    int a = 5;\n    mostafa(a);\n    cout << a;\n    return 0;\n}`,
                options: [
                    "5",
                    "10",
                    "15",
                    "20",
                    "25"
                ],
                correct: 1,
                hint: "Pay attention to how the variable is passed by reference."
            },
            {
                question: "What is the output of the following code?",
                code: `#include <iostream>\nusing namespace std;\nint main() {\n    int arr[] = {1, 3, 5, 7, 9};\n    for (int i = 1; i < 5; i += 2) {\n    arr[i] = arr[i - 1] + arr[i + 1];\n    }\n    for (int i = 0; i < 5; i++) {\n    cout << arr[i] << " ";\n    }\n    return 0;\n}`,
                options: [
                    "1 3 5 7 9",
                    "1 6 5 7 9",
                    "1 3 5 16 9",
                    "1 6 5 14 9",
                    "1 6 5 16 9"
                ],
                correct: 3,
                hint: "Pay attention to how the array elements are modified within the loop."
            },
            {
                question: "What is the output of the following code?",
                code: `#include <iostream>\nusing namespace std;\nint main() {\n    for (int i = 0, j = 10; i < j; i++, j--) {\n    cout << i << " " << j << " ";\n    }\n    return 0;\n}`,
                options: [
                    "0 10 1 9 2 8 3 7 4 6 5 5",
                    "0 10 1 9 2 8 3 7 4 6 5 5 6 4",
                    "0 10 1 9 2 8 3 7 4 6",
                    "0 10 1 9 2 8 3 7 4 6 5 5 6 4 7 3",
                    "0 10 1 9 2 8 3 7 4 6 5 5 6 4 7 3 8 2"
                ],
                correct: 2,
                hint: "Pay attention to how the loop works and updates the variables."
            },
            {
                question: "What is the output of the following code?",
                code: `#include <iostream>\nusing namespace std;\nint main() {\n    int arr[4] = {1, 2, 3, 4};\n    for (int i = 0; i < 4; i++) {\n    arr[i] = arr[(i + 1) % 4];\n    }\n    for (int i = 0; i < 4; i++) {\n    cout << arr[i] << " ";\n    }\n    return 0;\n}`,
                options: [
                    "1 2 3 4",
                    "4 1 2 3",
                    "3 4 1 2",
                    "2 3 4 0",
                    "1 3 2 4"
                ],
                correct: 3,
                hint: "Pay attention to how the array elements are modified within the loop."
            }
        ];

        let currentQuestion = 0;
        let lives = 3; // عدد القلوب (الحيوات)
        let hintClickCount = 0; // عداد الضغط على اللمبة

        const questionElem = document.getElementById("question");
        const codeSnippetElem = document.getElementById("code-snippet");
        const optionsElem = document.getElementById("options");
        const feedbackElem = document.getElementById("feedback");
        const hintElem = document.getElementById("hint");
        const heartsElem = document.getElementById("hearts");
        const resetBtn = document.getElementById("resetBtn");

        // التحقق من الجهاز
        function checkDeviceAccess() {
            const deviceId = localStorage.getItem("examDeviceId");

            // لو مفيش معرف مخزن، نولد واحد جديد ونسمح بالدخول
            if (!deviceId) {
                const uniqueId = Math.random().toString(36).substring(2) + Date.now().toString(36);
                localStorage.setItem("examDeviceId", uniqueId);
                return true;
            }

            // لو الجهاز مسجل قبل كده وخسر القلوب، يتمنع
            if (localStorage.getItem("examCompleted") === "true") {
                questionElem.innerText = "عذرًا، لا يمكنك الدخول للامتحان مرة أخرى!";
                codeSnippetElem.innerHTML = "";
                optionsElem.innerHTML = "";
                hintElem.classList.add("hidden");
                heartsElem.innerHTML = "";
                resetBtn.classList.add("hidden");
                return false;
            }

            return true;
        }

        function updateHearts() {
            heartsElem.innerHTML = "❤️".repeat(lives); // تحديث عدد القلوب المعروضة
        }

        function loadQuestion() {
            if (!checkDeviceAccess()) return; // التحقق من الوصول

            if (lives <= 0) {
                endExamDueToLives();
                return;
            }

            if (currentQuestion >= questions.length) {
                questionElem.innerText = "تم الانتهاء من الاختبار!";
                codeSnippetElem.innerHTML = "";
                optionsElem.innerHTML = "";
                hintElem.classList.add("hidden");
                heartsElem.innerHTML = "";
                resetBtn.classList.add("hidden");
                return;
            }

            const q = questions[currentQuestion];
            questionElem.innerText = q.question;
            codeSnippetElem.innerHTML = `<pre>${q.code}</pre>`;
            hintElem.innerText = q.hint;
            hintElem.classList.add("hidden");
            optionsElem.innerHTML = "";
            q.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.className = "btn btn-primary p-2 shadow-lg";
                btn.innerText = option;
                btn.onclick = () => checkAnswer(index, q.correct);
                optionsElem.appendChild(btn);
            });
            updateHearts(); // تحديث عرض القلوب
        }

        function checkAnswer(selected, correct) {
            if (selected === correct) {
                feedbackElem.innerHTML = "✅ <span class='success'>إجابة صحيحة!</span>";
                setTimeout(() => {
                    feedbackElem.innerHTML = "";
                    currentQuestion++;
                    loadQuestion();
                }, 1000);
            } else {
                lives--; // تقليل عدد القلوب
                feedbackElem.innerHTML = "❌ <span class='wrong'>إجابة خاطئة!</span>";
                setTimeout(() => {
                    feedbackElem.innerHTML = "";
                    loadQuestion();
                }, 1000);
            }
        }

        function endExamDueToLives() {
            questionElem.innerText = "تم إغلاق الامتحان بسبب نفاد الحيوات!";
            codeSnippetElem.innerHTML = "";
            optionsElem.innerHTML = "";
            hintElem.classList.add("hidden");
            heartsElem.innerHTML = "";
            localStorage.setItem("examCompleted", "true"); // تسجيل إن الامتحان خلّص
            resetBtn.classList.remove("hidden"); // إظهار زر الإعادة بعد الضغط على اللمبة 3 مرات
        }

        function showHint() {
            hintElem.classList.toggle("hidden");
            hintClickCount++; // زيادة العداد
            if (hintClickCount === 3) {
                resetBtn.classList.remove("hidden"); // إظهار زر الإعادة بعد 3 ضغطات
            }
        }

        function resetExam() {
            lives = 3; // إعادة القلوب
            currentQuestion = 0; // إعادة الأسئلة من البداية
            localStorage.removeItem("examCompleted"); // حذف حالة المنع
            resetBtn.classList.add("hidden"); // إخفاء الزر مرة أخرى
            hintClickCount = 0; // تصفير عداد اللمبة
            loadQuestion(); // تحميل الامتحان من جديد
        }

        loadQuestion();
    </script>
</body>
</html>
