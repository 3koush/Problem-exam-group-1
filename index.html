<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Cyber Quiz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</head>
<body>
    <div class="theme-toggle" onclick="toggleTheme()">
        <i class="fas fa-moon"></i>
    </div>

    <!-- Popup for name and mobile -->
    <div id="popup" class="popup">
        <div class="popup-content">
            <h2>Welcome to the C++ Cyber Quiz</h2>
            <p>Please enter your details to start:</p>
            <input type="text" id="fullName" placeholder="Enter your full name (quadruple)" required>
            <input type="tel" id="mobile" placeholder="Enter your mobile number" required>
            <button onclick="startQuiz()">Start Quiz</button>
        </div>
    </div>

    <div class="quiz-container" id="quizContainer">
        <div id="timer" class="timer">Time Left: 10:00</div> <!-- عداد الوقت -->
        <div id="chicks" class="chicks">
            <span class="chick">🐥</span>
            <span class="chick">🐥</span>
            <span class="chick">🐥</span>
        </div>
        <h2 id="question" class="question-text"></h2>
        <i class="fas fa-lightbulb hint-btn" onclick="showHint()"></i>
        <p id="hint" class="hidden mt-2"></p>
        <div class="code-box" id="code-snippet"></div>
        <div id="options" class="d-grid gap-2 mt-3"></div>
        <p id="feedback" class="mt-3"></p>
        <p id="score-display" class="mt-3">Score: 0</p>
        <div id="points-notification" class="points-notification hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
